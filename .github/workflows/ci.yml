name: CI

# Push-to-live pipeline: test -> (gate) -> deploy -> smoke-test.
# Only code that passes every test on every Python version reaches the live site.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Public URL of the Render service. Override with a repository variable
  # named LIVE_URL if Render gave the service a different address.
  LIVE_URL: ${{ vars.LIVE_URL || 'https://functional-testing-2405207.onrender.com' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }} with pip caching
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check --output-format=github .

      - name: Run all tests (fails below 100% line and branch coverage of target.py)
        run: >
          pytest
          --cov=target
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=100
          --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            junit-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 30

  deploy:
    # The gate: runs only when every test job passed, and only for pushes to main.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ env.LIVE_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Trigger the Render deploy hook for this exact commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::The RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          status=$(curl --silent --show-error --output response.json \
            --write-out '%{http_code}' --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          echo "Render responded with HTTP ${status}"
          cat response.json; echo
          case "$status" in
            200|201|202) echo "Deploy of ${GITHUB_SHA} requested." ;;
            *) echo "::error::Render rejected the deploy request."; exit 1 ;;
          esac

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wait for the new SHA on the live site, then check three live requests
        run: >
          python scripts/smoke_test.py
          --url "$LIVE_URL"
          --sha "$GITHUB_SHA"
          --timeout 900
          --interval 15
