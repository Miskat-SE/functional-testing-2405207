name: CI

# Lint and test every push and every pull request to main.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }} with pip caching
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check --output-format=github .

      - name: Run all tests (fails below 100% line and branch coverage of target.py)
        run: >
          pytest
          --cov=target
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=100
          --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            junit-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 30
